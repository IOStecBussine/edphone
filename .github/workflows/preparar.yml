
name: Preparar EDPHONE

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Crear aplicacion
        run: |
          flutter create --org com.edphone --project-name edphone --platforms android .

      - name: Verificar codigo Flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Crear APK Android
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: EDPHONE-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Guardar archivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Crear estructura inicial EDPHONE" || echo "Sin cambios"
          git push
